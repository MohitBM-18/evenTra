name: eventra
description: evenTra - Smart Venue Management & Auditorium Booking System for Christ University
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.5
  firebase_core: ^3.6.0
  geolocator: ^13.0.1
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  table_calendar: ^3.1.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  firebase_storage: ^12.4.10
  image_picker: ^1.2.2
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/eventra_logo.png"
  min_sdk_size: 21
